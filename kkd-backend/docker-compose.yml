services:
  db:
    image: postgres:15
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-kkd}
      POSTGRES_USER: ${POSTGRES_USER:-kkd}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-kkd}
    ports: ["5432:5432"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U kkd -d kkd"]
      interval: 5s
      timeout: 5s
      retries: 10
  app:
    build: .
    depends_on:
      db:
        condition: service_healthy
    environment:
      DB_URL: ${DB_URL:-jdbc:postgresql://db:5432/kkd}
      DB_USERNAME: ${DB_USERNAME:-kkd}
      DB_PASSWORD: ${DB_PASSWORD:-kkd}
      SERVER_PORT: ${SERVER_PORT:-8080}
    ports: ["8080:8080"]
